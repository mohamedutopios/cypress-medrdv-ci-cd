name: CI/CD – Tests fonctionnels

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PHP_VERSION: "8.2"
  NODE_VERSION: "18"
  APP_ENV: test
  DATABASE_URL: "mysql://medrdv_user:medrdv_pass@127.0.0.1:3306/medrdv_db?serverVersion=8.0.32&charset=utf8mb4"

jobs:

# ============================================================================
# JOB 1 : BUILD & VALIDATION
# ============================================================================
  build:
    name: 🔨 Build & Validation Symfony
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_mysql, intl, zip
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          npm ci

      - name: Symfony lint & checks
        run: |
          php bin/console lint:twig templates/
          php bin/console lint:container

# ============================================================================
# JOB 2 : CYPRESS E2E + RAPPORT HTML
# ============================================================================
  cypress:
    name: 🧪 Tests fonctionnels – Médecins
    runs-on: ubuntu-latest
    needs: build

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: medrdv_db
          MYSQL_USER: medrdv_user
          MYSQL_PASSWORD: medrdv_pass
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_mysql, intl, zip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          npm ci

      - name: Prepare database
        run: |
          php bin/console doctrine:database:create --if-not-exists

          if ls migrations/Version*.php 1> /dev/null 2>&1; then
            echo "Doctrine migrations detected → running migrate"
            php bin/console doctrine:migrations:migrate --no-interaction
          else
            echo "No Doctrine migrations detected → using schema:create"
            php bin/console doctrine:schema:create
          fi

          php bin/console doctrine:fixtures:load --no-interaction





      - name: Start Symfony server
        run: |
          symfony server:start --daemon
          sleep 5

      - name: Run Cypress (Mochawesome)
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          wait-on: http://127.0.0.1:8000
          config: baseUrl=http://127.0.0.1:8000

      - name: Upload HTML report (client)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-fonctionnels
          path: cypress/reports
          retention-days: 30

      - name: Upload screenshots (si échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preuves-ecran
          path: cypress/screenshots
          retention-days: 7
